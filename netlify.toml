[build]
  publish = "."
  command = "echo 'No build step required — static site'"

[[headers]]
  for = "/*.json"
  [headers.values]
  cache-control = "public, max-age=300"

[[headers]]
  for = "/css/*"
  [headers.values]
  cache-control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
  cache-control = "public, max-age=86400"

