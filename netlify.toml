[build]
  publish = "."
  command = "echo 'No build step required — static site'"

# Redirect /admin/* to the Decap CMS panel
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Fallback for client-side routing (not strictly needed for static, but safe)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.json"
  [headers.values]
  cache-control = "public, max-age=300"

[[headers]]
  for = "/css/*"
  [headers.values]
  cache-control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
  cache-control = "public, max-age=86400"