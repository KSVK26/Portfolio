<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Career timeline and CV of K S Vasanth Karthik — esports operations and creative work." />
  <meta property="og:title" content="CV & Timeline — K S Vasanth Karthik" />
  <meta property="og:description" content="Career timeline of K S Vasanth Karthik across esports and creative work." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ksvk.netlify.app/cv.html" />
  <meta property="og:image" content="https://ksvk.netlify.app/images/ksvk-black.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="canonical" href="https://ksvk.netlify.app/cv.html" />
  <title>Career Timeline — K S Vasanth Karthik</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="images/ksvk-black.png" />
</head>
<body>
  <div data-include="components/header.html"></div>

  <main class="container">
    <section class="page-section">
      <span class="section-tag">CV</span>
      <h1 class="section-title">Curriculum Vitae</h1>
      <p class="section-subtitle">
        A visual timeline of my life and work. Searchable and downloadable.
      </p>
      <div style="margin-bottom:2rem;">
        <a href="#" class="btn-secondary">Download PDF</a>
      </div>
    </section>

    <section class="page-section">
      <div class="search-input-wrapper">
        <input type="text" class="search-input" id="cv-search" placeholder="Search timeline by role, company, or year…" />
      </div>
      <div class="timeline-container">
        <div class="timeline-stream" id="cv-timeline">
          <!-- Populated by js/cv.js -->
        </div>
      </div>
    </section>

    <section class="page-section">
      <span class="section-tag">Skills</span>
      <h2 class="section-title" style="font-size:1.5rem;">Capability map</h2>
      <div class="cards-grid" style="margin-top:1.5rem;">
        <div class="card"><span class="card-tag">Design</span><h3 class="card-title">Design Strategy, Branding</h3></div>
        <div class="card"><span class="card-tag">Build</span><h3 class="card-title">Web Development, Prototyping</h3></div>
        <div class="card"><span class="card-tag">Lead</span><h3 class="card-title">Community Building, Mentorship</h3></div>
        <div class="card"><span class="card-tag">Think</span><h3 class="card-title">Research, Positioning, Writing</h3></div>
      </div>
    </section>
  </main>

  <div data-include="components/footer.html"></div>

  <script src="js/main.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/cv.js"></script>
</body>
</html>
