<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Admin — Portfolio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/decap-cms@3.0.0/dist/decap-cms.css" />
</head>
<body>
  <script src="https://identity.netlify.com/v1/identity.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.0.0/dist/decap-cms.js"></script>
  <script>
    window.CMS.registerMediaLibrary({
      name: "default",
      label: "Default",
      allowArbitrary: true,
    });
    window.CMS.registerMediaLibrary({
      name: "image",
      label: "Images",
      allowArbitrary: true,
    });
  </script>
</body>
</html>
