backend:
  name: github
  repo: <your-username>/<your-repo-name>
  branch: main
  base_url: https://www.netlify.com/sites/<your-site-slug>/
  identity:
    url: https://identity.netlify.com/v1/identity
    # Optional: open_authoring: true

media_library:
  name: default
  media_folder: images

collections:
  - name: stats
    label: Stats
    files:
      - name: stats
        label: Stats
        file: content/stats.json
        fields:
          - name: stats
            label: Stats
            type: array
            field:
              type: object
              fields:
                - { name: number, label: Number, type: string }
                - { name: label, label: Label, type: string }
                - { name: description, label: Description, type: string, multiline: true }

  - name: building-now
    label: Building Now
    files:
      - name: building-now
        label: Building Now
        file: content/building-now.json
        fields:
          - name: items
            label: Items
            type: array
            field:
              type: object
              fields:
                - { name: title, label: Title, type: string }
                - { name: role, label: Role, type: string }
                - { name: category, label: Category, type: string }
                - { name: period, label: Period, type: string }
                - { name: description, label: Description, type: string, multiline: true }

  - name: projects
    label: Projects
    files:
      - name: projects
        label: Projects
        file: content/projects.json
        fields:
          - name: items
            label: Items
            type: array
            field:
              type: object
              fields:
                - { name: title, label: Title, type: string }
                - { name: category, label: Category, type: string }
                - { name: tags, label: Tags, type: array, field: { type: string } }
                - { name: description, label: Description, type: string, multiline: true }
                - { name: year, label: Year, type: string }
                - { name: readTime, label: Read Time, type: string }

  - name: writing
    label: Writing
    files:
      - name: writing
        label: Writing
        file: content/writing.json
        fields:
          - name: items
            label: Items
            type: array
            field:
              type: object
              fields:
                - { name: title, label: Title, type: string }
                - { name: format, label: Format, type: string }
                - { name: topic, label: Topic, type: string }
                - { name: date, label: Date, type: date }
                - { name: readTime, label: Read Time, type: string }
                - { name: excerpt, label: Excerpt, type: string, multiline: true }

  - name: timeline
    label: Timeline
    files:
      - name: timeline
        label: Timeline
        file: content/timeline.json
        fields:
          - name: items
            label: Items
            type: array
            field:
              type: object
              fields:
                - { name: year, label: Year, type: string }
                - { name: title, label: Title, type: string }
                - { name: subtitle, label: Subtitle, type: string }
                - { name: description, label: Description, type: string, multiline: true }