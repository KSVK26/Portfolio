<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Search across the portfolio of K S Vasanth Karthik — projects, timeline, and notes." />
  <meta property="og:title" content="Search — K S Vasanth Karthik" />
  <meta property="og:description" content="Search projects, timeline, and notes by K S Vasanth Karthik." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ksvk.netlify.app/search.html" />
  <meta property="og:image" content="https://ksvk.netlify.app/images/ksvk-black.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="canonical" href="https://ksvk.netlify.app/search.html" />
  <title>Search — K S Vasanth Karthik</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="images/ksvk-black.png" />
  <!-- Editorial Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Paper Grain Overlay -->
  <div class="paper-grain" aria-hidden="true"></div>

  <div data-include="components/header.html"></div>

  <main class="container">
    <section class="page-section border-b border-rule-light dark:border-rule-dark">
      <div class="flex items-center gap-3 mb-6">
        <span class="font-mono text-xs tracking-widest text-vermilion font-medium">SEARCH</span>
      </div>
      <h1 class="font-serif text-4xl sm:text-5xl text-ink-light dark:text-ink-dark mb-4">
        Search across the site
      </h1>
      <p class="font-sans text-base sm:text-lg leading-relaxed text-ink-muted dark:text-ink-darkMuted max-w-2xl mb-8">
        Find projects, timeline events, and pages.
      </p>

      <div class="search-input-wrapper" style="max-width: 480px;">
        <input type="text" class="form-input" id="global-search-input" placeholder="Type to search everything…" autofocus />
      </div>
    </section>

    <section class="page-section">
      <div id="search-status" class="font-mono text-xs text-ink-muted dark:text-ink-darkMuted mb-6 min-h-[1.5rem]"></div>
      <div class="editorial-grid" id="search-results-grid"></div>
    </section>
  </main>

  <div data-include="components/footer.html"></div>

  <script src="js/main.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
